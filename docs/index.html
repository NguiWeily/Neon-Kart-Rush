<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Kart Rush</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050514;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.badge{position:fixed;right:12px;top:10px;color:#bdefff;font:600 12px system-ui;opacity:.7;pointer-events:none}</style></head><body><canvas id="g"></canvas><div class="badge">NEON KART RUSH • WEB PREVIEW</div>
<script>
const cv=document.getElementById('g'),x=cv.getContext('2d');let W=1280,H=720,D=0,speed=0,px=0,boost=100,t=0,state=0,left=0,right=0,nitro=0,coins=0,lap=1,last=performance.now();const L=5200;
function resize(){let d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function curve(d){return Math.sin(d*.00135)*.55+Math.sin(d*.00047+1.4)*.32}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const rivals=[[-.72,500,'#ff4fa3'],[-.35,1050,'#7c4dff'],[.02,1600,'#ffd740'],[.39,2200,'#69f0ae'],[.72,2800,'#ff6e40']];const picks=Array.from({length:45},(_,i)=>[(Math.sin(i*7.3)*.72),520+i*250,i%7===0,0]);
function poly(a,c){x.fillStyle=c;x.beginPath();x.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)x.lineTo(a[i][0],a[i][1]);x.closePath();x.fill()}
function sky(){let g=x.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,'#070a26');g.addColorStop(.52,'#24165e');g.addColorStop(1,'#ed438d');x.fillStyle=g;x.fillRect(0,0,W,H*.6);for(let i=0;i<45;i++){x.fillStyle='rgba(255,255,255,.45)';x.beginPath();x.arc((i*197%997)/997*W,(i*83%311)/311*H*.31,1+i%2,0,7);x.fill()}let sx=W*.78,sy=H*.27,sr=H*.12;g=x.createRadialGradient(sx,sy,3,sx,sy,sr);g.addColorStop(0,'#fff9ac');g.addColorStop(.4,'#ff67ae');g.addColorStop(1,'rgba(255,70,150,0)');x.fillStyle=g;x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();x.fillStyle='#151740';x.beginPath();x.moveTo(0,H*.49);for(let i=0;i<=14;i++)x.lineTo(i*W/14,H*(.36+((i*37)%7)*.016));x.lineTo(W,H*.6);x.lineTo(0,H*.6);x.fill()}
function road(){let hy=H*.39,prevY=H,prevHalf=W*.55,prevC=W*.5-px*W*.17;for(let i=79;i>=0;i--){let q=i/80,y=hy+q**1.72*(H-hy),half=W*(.035+q**1.25*.50),wave=curve(D+(1-q)*1450),c=W*.5-px*W*.17*q**1.5+wave*W*.14*(1-q),st=(Math.floor(D/55)+i)%2;poly([[c-half,y],[c+half,y],[prevC+prevHalf,prevY],[prevC-prevHalf,prevY]],st?'#22243f':'#1a1c32');let r=half*.08,co=st?'#00e5ff':'#ff3d9a';poly([[c-half-r,y],[c-half,y],[prevC-prevHalf,prevY],[prevC-prevHalf-r,prevY]],co);poly([[c+half,y],[c+half+r,y],[prevC+prevHalf+r,prevY],[prevC+prevHalf,prevY]],co);if(i%7<3){x.fillStyle='rgba(255,255,255,.75)';for(let ln of [-1,1]){let xx=c+ln*half*.34,pp=prevC+ln*prevHalf*.34,lw=Math.max(1,half*.012);poly([[xx-lw,y],[xx+lw,y],[pp+lw,prevY],[pp-lw,prevY]],'rgba(255,255,255,.7)')}}if(i%8===0){let rr=2+18*q;x.fillStyle='#00e5ff';for(let xx of [c-half*1.2,c+half*1.2]){x.globalAlpha=.18;x.beginPath();x.arc(xx,y,rr*2.5,0,7);x.fill();x.globalAlpha=1;x.beginPath();x.arc(xx,y,rr,0,7);x.fill()}}prevY=y;prevHalf=half;prevC=c}}
function project(rel,lane){let z=1-clamp(rel/1400,0,1),y=H*.39+z**1.72*H*.61,half=W*(.035+z**1.25*.5),c=W*.5-px*W*.17*z**1.5+curve(D+rel)*W*.14*(1-z);return[c+lane*half*.72,y,Math.max(.15,z)]}
function kart(k,y,s,c){let bw=70*s,bh=42*s;x.fillStyle='rgba(0,229,255,.22)';x.beginPath();x.ellipse(k,y+bh*.25,bw*.65,bh*.38,0,0,7);x.fill();x.fillStyle='#090a12';round(k-bw*.58,y-bh*.05,bw*1.16,bh*.54,10*s);x.fillStyle=c;round(k-bw*.43,y-bh*.38,bw*.86,bh*.63,10*s);x.fillStyle='#e8faff';round(k-bw*.22,y-bh*.31,bw*.44,bh*.24,5*s);x.fillStyle='#05050a';for(let q of [-.48,.48]){x.beginPath();x.arc(k+bw*q,y+bh*.35,10*s,0,7);x.fill()}}
function round(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r);x.fill()}
function objs(){for(let r of rivals){let rd=r[1]+(t*165)% (L*3),rel=rd-D;while(rel<-100)rel+=L*3;if(rel>35&&rel<1400){let p=project(rel,r[0]);kart(...p,r[2])}}for(let p of picks){if(p[3])continue;let qd=p[1],rel=qd-D;while(rel<-100)rel+=L*3;if(rel>25&&rel<1400){let [xx,yy,s]=project(rel,p[0]),rr=(p[2]?22:16)*s,c=p[2]?'#00e5ff':'#ffd740';x.fillStyle=c;x.shadowColor=c;x.shadowBlur=18;x.beginPath();x.arc(xx,yy,rr,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.textAlign='center';x.font=`700 ${rr}px system-ui`;x.fillText(p[2]?'⚡':'$',xx,yy+rr*.38)}}}
function player(){let xx=W*.5,y=H*.82,bw=W*.17;x.save();x.translate(xx,y);x.rotate((right-left)*.08);x.fillStyle='rgba(0,229,255,.25)';x.beginPath();x.ellipse(0,H*.055,W*.1,H*.045,0,0,7);x.fill();x.fillStyle='#05060c';round(-W*.085,-H*.015,W*.17,H*.085,18);x.fillStyle=nitro&&boost>0?'#00e5ff':'#ff3d9a';x.shadowColor=x.fillStyle;x.shadowBlur=18;round(-W*.062,-H*.065,W*.124,H*.105,20);x.shadowBlur=0;x.fillStyle='#d7f7ff';round(-W*.033,-H*.052,W*.066,H*.034,9);x.fillStyle='#090a10';for(let q of [-.073,.073]){x.beginPath();x.arc(W*q,H*.048,H*.027,0,7);x.fill()}if(nitro&&boost>0){let g=x.createLinearGradient(0,H*.04,0,H*.18);g.addColorStop(0,'#fff');g.addColorStop(.25,'#00e5ff');g.addColorStop(1,'rgba(0,229,255,0)');x.fillStyle=g;poly([[-W*.026,H*.04],[0,H*.18],[W*.026,H*.04]],g)}x.restore()}
function hud(){x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=8;x.font=`800 ${H*.045}px system-ui`;x.textAlign='left';x.fillStyle='#fff';x.fillText(String(speed|0).padStart(3,'0')+' km/h',W*.035,H*.085);x.font=`700 ${H*.03}px system-ui`;x.fillStyle='#b7eaff';x.fillText(`LAP ${lap} / 3`,W*.038,H*.13);x.textAlign='center';x.fillStyle='#ffd740';x.fillText(`COINS  ${coins}`,W*.5,H*.075);x.shadowBlur=0;let bx=W*.77,by=H*.9,bw=W*.17,bh=H*.026;x.fillStyle='rgba(16,19,40,.7)';round(bx,by,bw,bh,bh/2);let g=x.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ff3d9a');g.addColorStop(1,'#00e5ff');x.fillStyle=g;round(bx,by,bw*boost/100,bh,bh/2);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;for(let [cx,cy,r] of [[W*.075,H*.87,H*.07],[W*.19,H*.87,H*.07],[W*.93,H*.84,H*.075]]){x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}x.fillStyle='rgba(255,255,255,.7)';x.font=`700 ${H*.05}px system-ui`;x.textAlign='center';x.fillText('‹',W*.075,H*.888);x.fillText('›',W*.19,H*.888);x.font=`700 ${H*.022}px system-ui`;x.fillText('BOOST',W*.93,H*.848)}
function title(){x.fillStyle='rgba(0,0,0,.42)';x.fillRect(0,0,W,H);x.textAlign='center';x.font=`900 ${H*.115}px system-ui`;x.fillStyle='#fff';x.shadowColor='#00e5ff';x.shadowBlur=28;x.fillText('NEON KART',W*.5,H*.36);x.font=`900 ${H*.095}px system-ui`;x.fillStyle='#ff3d9a';x.shadowColor='#ff3d9a';x.fillText('RUSH',W*.5,H*.47);x.shadowBlur=0;x.font=`700 ${H*.031}px system-ui`;x.fillStyle='#d9f8ff';x.fillText('3 LAPS  •  5 RIVALS  •  BOOST  •  COINS',W*.5,H*.58);x.font=`800 ${H*.04}px system-ui`;x.fillStyle='#fff';x.fillText('TAP TO RACE',W*.5,H*.72);x.font=`600 ${H*.021}px system-ui`;x.fillStyle='#9aa6c3';x.fillText('Original procedural arcade racer • no external art assets',W*.5,H*.82)}
function update(dt){t+=dt;if(!state)return;let ts=nitro&&boost>0?265:205;speed+=(ts-speed)*Math.min(1,dt*3);if(nitro&&boost>0)boost=Math.max(0,boost-dt*29);else boost=Math.min(100,boost+dt*7);px+=(right-left)*dt*(1+speed/230);px-=curve(D)*dt*.55*(speed/210);px=clamp(px,-1.08,1.08);if(Math.abs(px)>.88)speed-=dt*80;D+=speed*dt*.92;if(D>lap*L){lap++;if(lap>3){state=0;lap=1;D=0;coins=0}}for(let p of picks){if(p[3])continue;let rel=p[1]-D;while(rel<-100)rel+=L*3;if(rel>0&&rel<30&&Math.abs(p[0]-px)<.2){p[3]=1;coins++;if(p[2])boost=Math.min(100,boost+38)}}}
function frame(now){let dt=Math.min(.034,(now-last)/1000);last=now;update(dt);sky();road();objs();player();if(state)hud();else title();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function pos(e){let q=e.touches?e.touches[0]:e,xx=q.clientX,yy=q.clientY;if(!state){state=1;return}left=right=nitro=0;if(xx>W*.82&&yy>H*.65)nitro=1;else if(xx<W*.14&&yy>H*.62)left=1;else if(xx<W*.30&&yy>H*.62)right=1;else if(xx<W*.5)left=1;else right=1}addEventListener('pointerdown',pos);addEventListener('pointermove',e=>{if(e.buttons)pos(e)});addEventListener('pointerup',()=>left=right=nitro=0);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=1;if(e.key==='ArrowRight'||e.key==='d')right=1;if(e.key===' ')nitro=1;if(!state&&e.key==='Enter')state=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=0;if(e.key==='ArrowRight'||e.key==='d')right=0;if(e.key===' ')nitro=0});
</script></body></html>
